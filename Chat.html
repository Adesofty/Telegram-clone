<!DOCTYPE html>
<html>
<head>
<title>Telegram Clone</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial; background: #e5ddd5; margin: 0; }
#chatBox { height: 75vh; overflow-y: scroll; padding: 10px; }
.message { background: white; padding: 8px 12px; margin: 8px; border-radius: 10px; max-width: 70%; }
.me { background: #dcf8c6; margin-left: auto; }
#inputArea { display: flex; padding: 10px; background: white; position: fixed; bottom: 0; width: 100%; }
#msg { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; }
#send { padding: 10px 20px; background: #25D366; color: white; border: none; border-radius: 20px; margin-left: 5px; }
</style>
</head>
<body>

<h3 style="text-align:center;background:white;padding:10px;">Chat with: <span id="chatWith"></span></h3>
<div id="chatBox"></div>

<div id="inputArea">
  <input id="msg" placeholder="Type message...">
  <button id="send" onclick="sendMessage()">Send</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD_La-q3D6og9BEq0FrcyaeW7HSgTO1yN4",
  authDomain: "order-app1010.firebaseapp.com",
  databaseURL: "https://order-app1010-default-rtdb.firebaseio.com",
  projectId: "order-app1010"
}
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ASK FOR NAMES
const myName = prompt("Enter YOUR ID/Name:");
const chatWith = prompt("Enter FRIEND ID/Name to chat:");
document.getElementById('chatWith').innerText = chatWith;

// Create unique room ID
const roomID = [myName, chatWith].sort().join("_");

// Send Message
function sendMessage() {
  const msg = document.getElementById('msg').value;
  if(msg != "") {
    db.ref('privateChats/' + roomID).push({
      name: myName,
      message: msg,
      time: Date.now()
    });
    document.getElementById('msg').value = "";
  }
}

// Show messages live
db.ref('privateChats/' + roomID).on('child_added', (snapshot) => {
  let data = snapshot.val();
  let div = document.createElement('div');
  div.className = 'message ' + (data.name == myName ? 'me' : '');
  div.innerHTML = `<b>${data.name}:</b> ${data.message}`;
  document.getElementById('chatBox').appendChild(div);
  document.getElementById('chatBox').scrollTop = chatBox.scrollHeight;
});
</script>
</body>
</html>
