<body>
<h2>Telegram Clone</h2>
<div id="chat"></div>
<input id="msg" placeholder="Type message...">
<input type="file" id="fileInput" accept="audio/*,video/*,image/*">
<button onclick="sendMessage()">Send</button>
<button>Delete Chat</button>
<script>
let myId = prompt("Enter YOUR ID:");
let friendId = prompt("Enter FRIEND ID:");
let chat = document.getElementById("chat");
let key = "chat_" + [myId, friendId].sort().join("_");

function load() {
  chat.innerHTML = "";
  let msgs = JSON.parse(localStorage.getItem(key) || "[]");
  msgs.forEach(m => {
    let div = document.createElement("div");
    div.className = "msg " + (m.from === myId ? "me" : "friend");
    div.innerText = m.from + ": " + m.text;
    chat.appendChild(div);
  });
  chat.scrollTop = chat.scrollHeight;
}

function send() {
  let txt = document.getElementById("msg").value;
  if(!txt) return;
  let msgs = JSON.parse(localStorage.getItem(key) || "[]");
  msgs.push({from: myId, text: txt, time: Date.now()});
  localStorage.setItem(key, JSON.stringify(msgs));
  document.getElementById("msg").value = "";
  load();
}
function deleteChat() {
  if(confirm("Are you sure you want to delete this chat?")) {
    localStorage.removeItem(key);
    load();
    alert("Chat deleted!");
  }
  }
setInterval(load, 2000);
load();
function sendMessage() {
  const msg = document.getElementById('msg').value;
  const file = document.getElementById('fileInput').files[0];
  const chatBox = document.getElementById('chat-box');
  const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

  if(msg) {
    chatBox.innerHTML += `<div class="msg you">${msg}<span class="time">${time} ✓✓</span></div>`;
  }
  if(file) {
    const url = URL.createObjectURL(file);
    if(file.type.startsWith('image/')){
      chatBox.innerHTML += `<div class="msg you"><img src="${url}" width="200" style="border-radius:10px"><span class="time">${time} ✓✓</span></div>`;
    }
  }
  document.getElementById('msg').value = "";
  document.getElementById('fileInput').value = "";
  chatBox.scrollTop = chatBox.scrollHeight;
}
</script>
</body>
