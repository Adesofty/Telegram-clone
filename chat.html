<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFE ❤️</title>
<link rel="icon" href="Screenshot_20250810-132542_1.jpg">
    <link rel="manifest" href="manifest.json">
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0e1621;
    color: white;
    height: 100vh;
    display: flex;
    flex-direction: column;
}
.header {
    background: #17212b;
    padding: 15px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    border-bottom: 1px solid #0e1621;
    display: flex;
    justify-content: space-between;
}
#chat-box {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
}
.message {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 15px;
    margin: 8px 0;
}
.me {
    background: #2b5278;
    margin-left: auto;
}
.input-area {
    display: flex;
    padding: 10px;
    background: #17212b;
}
#msg {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 20px;
    background: #242f3d;
    color: white;
}
button {
    margin-left: 10px;
    padding: 12px 20px;
    background: #5288c1;
    color: white;
    border: none;
    border-radius: 20px;
}
</style>
</head>
<body>

<div class="header">
    <span>IFE ❤️</span>
    <button onclick="localStorage.clear();location.reload()">Clear</button>
</div>

<div id="chat-box"></div>

<div class="input-area">
    <input type="text" id="msg" placeholder="Write a message...">
    <button onclick="send()">Send</button>
</div>

<script>
function load(){
    document.getElementById("chat-box").innerHTML = "";
    JSON.parse(localStorage.getItem("msgs")||"[]").forEach(m=>{
        let d=document.createElement("div");
        d.className="message me";
        d.textContent=m;
        document.getElementById("chat-box").appendChild(d);
    });
}
function send(){
    let t=document.getElementById("msg").value;
    if(!t) return;
    let msgs=JSON.parse(localStorage.getItem("msgs")||"[]");
    msgs.push(t);
    localStorage.setItem("msgs",JSON.stringify(msgs));
    document.getElementById("msg").value="";
    load();
}
load();
</script>
</body>
</html>
