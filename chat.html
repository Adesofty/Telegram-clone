body { font-family: Arial; background: #eef; padding: 20px; }
#chat { background: white; padding: 10px; height: 400px; overflow-y: scroll; border: 1px solid #ccc; }
input, button { padding: 10px; margin: 5px; border-radius: 20px; border: none; }
button { background: #0088cc; color: white; font-weight: bold; }
button:hover { background: #0077b3; }
.msg { margin: 5px 0; }
.me { color: blue; }
.friend { color: green; }
</style>
</head>
<body>
<h2>Telegram Clone</h2>
<div id="chat"></div>
<input id="msg" placeholder="Type message...">
<input type="file" id="fileInput" accept="audio/*,video/*,image/*">
<button onclick="sendMessage()">Send</button>
<button>Delete Chat</button>
<script>
let myId = prompt("Enter YOUR ID:");
let friendId = prompt("Enter FRIEND ID:");
let chat = document.getElementById("chat");
let key = "chat_" + [myId, friendId].sort().join("_");

function load() {
  chat.innerHTML = "";
  let msgs = JSON.parse(localStorage.getItem(key) || "[]");
  msgs.forEach(m => {
    let div = document.createElement("div");
    div.className = "msg " + (m.from === myId ? "me" : "friend");
    div.innerText = m.from + ": " + m.text;
    chat.appendChild(div);
  });
  chat.scrollTop = chat.scrollHeight;
}

function send() {
  let txt = document.getElementById("msg").value;
  if(!txt) return;
  let msgs = JSON.parse(localStorage.getItem(key) || "[]");
  msgs.push({from: myId, text: txt, time: Date.now()});
  localStorage.setItem(key, JSON.stringify(msgs));
  document.getElementById("msg").value = "";
  load();
}
function deleteChat() {
  if(confirm("Are you sure you want to delete this chat?")) {
    localStorage.removeItem(key);
    load();
    alert("Chat deleted!");
  }
  }
setInterval(load, 2000);
load();
     function sendMessage() {
  const msg = document.getElementById('msg').value;
  const file = document.getElementById('fileInput').files[0];
  const chatBox = document.getElementById('chat-box');

  if(file) {
    const url = URL.createObjectURL(file);
    if(file.type.startsWith('video/')){
      chatBox.innerHTML += `<video src="${url}" controls width="250"></video><br>`;
    }
    if(file.type.startsWith('audio/')){
      chatBox.innerHTML += `<audio src="${url}" controls></audio><br>`;
    }
    if(file.type.startsWith('image/')){
      chatBox.innerHTML += `<img src="${url}" width="250"><br>`;
    }
    document.getElementById('fileInput').value = "";
  }
  if(msg) {
    chatBox.innerHTML += `<p><b>You:</b> ${msg}</p>`;
  }
  document.getElementById('msg').value = "";
  chatBox.scrollTop = chatBox.scrollHeight;
} 
</script>
</body>
